<form class="forma" (submit)="$event.preventDefault(); dodaj()">
  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Naziv nove stavke</mat-label>
    <input matInput [formControl]="naziv" maxlength="100" />
  </mat-form-field>
  <button mat-flat-button type="submit" [disabled]="naziv.invalid || cuvanje()">
    {{ cuvanje() ? 'Čuvanje…' : 'Dodaj' }}
  </button>
</form>
@if (greska(); as tekst) {
  <p role="alert">{{ tekst }}</p>
} @else if (poruka(); as tekst) {
  <p role="status">{{ tekst }}</p>
}
